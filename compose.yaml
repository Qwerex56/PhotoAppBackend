services:
  traefik:
    image: traefik:v3.0
    container_name: photoapp_traefik
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/traefik/certs:/certs:ro
    networks:
      - photoapp_network
    depends_on:
      - authservice-api
      - usermanagementservice-api
      - mediaservice-api

  # PostgreSQL Database - Shared by AuthService and UserManagementService
  postgres:
    image: postgres:16-alpine
    container_name: photoapp_postgres
    environment:
      POSTGRES_DB: photoapp
      POSTGRES_USER: photoapp_user
      POSTGRES_PASSWORD: photoapp_secure_password_123!
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - photoapp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoapp_user -d photoapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"

  # RabbitMQ - Message Broker for Inter-Service Communication
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: photoapp_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: photoapp_user
      RABBITMQ_DEFAULT_PASS: photoapp_secure_password_123!
      RABBITMQ_DEFAULT_VHOST: /photoapp
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - photoapp_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache and Session Store
  redis:
    image: redis:7-alpine
    container_name: photoapp_redis
    command: redis-server --appendonly yes --requirepass photoapp_secure_password_123!
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - photoapp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  authservice-api:
    build:
      context: .
      dockerfile: src/Services/AuthService/AuthService.API/Dockerfile
    container_name: photoapp_authservice_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Frontend__DevOrigin: https://app.localhost
      ConnectionStrings__AuthService: Host=postgres;Port=5432;Database=authservice;Username=photoapp_user;Password=photoapp_secure_password_123!
      AuthJwt__Issuer: PhotoAppBackend.AuthService
      AuthJwt__Audience: PhotoAppBackend
      AuthJwt__SigningKey: photoapp-auth-service-dev-signing-key-32-plus-chars!!
      AuthDemo__AutoVerifyEmail: "true"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /photoapp
      RabbitMQ__Username: photoapp_user
      RabbitMQ__Password: photoapp_secure_password_123!
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - photoapp_network

  usermanagementservice-api:
    build:
      context: .
      dockerfile: src/Services/UserManagementService/UserManagementService.API/Dockerfile
    container_name: photoapp_usermanagementservice_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Frontend__DevOrigin: https://app.localhost
      ConnectionStrings__UserManagementService: Host=postgres;Port=5432;Database=usermanagementservice;Username=photoapp_user;Password=photoapp_secure_password_123!
      AuthJwt__Issuer: PhotoAppBackend.AuthService
      AuthJwt__Audience: PhotoAppBackend
      AuthJwt__SigningKey: photoapp-auth-service-dev-signing-key-32-plus-chars!!
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /photoapp
      RabbitMQ__Username: photoapp_user
      RabbitMQ__Password: photoapp_secure_password_123!
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - photoapp_network

  mediaservice-api:
    build:
      context: .
      dockerfile: src/Services/MediaService/MediaService.API/Dockerfile
    container_name: photoapp_mediaservice_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Frontend__DevOrigin: https://app.localhost
      ConnectionStrings__MediaService: Host=postgres;Port=5432;Database=mediaservice;Username=photoapp_user;Password=photoapp_secure_password_123!
      AuthJwt__Issuer: PhotoAppBackend.AuthService
      AuthJwt__Audience: PhotoAppBackend
      AuthJwt__SigningKey: photoapp-auth-service-dev-signing-key-32-plus-chars!!
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /photoapp
      RabbitMQ__Username: photoapp_user
      RabbitMQ__Password: photoapp_secure_password_123!
      Redis__ConnectionString: redis:6379,password=photoapp_secure_password_123!,abortConnect=false
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - photoapp_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: photoapp_frontend
    environment:
      NODE_ENV: production
    networks:
      - photoapp_network
    depends_on:
      - traefik

networks:
  photoapp_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local